<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Petition Submission – Eluyefa Chambers</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
}
.container {
  max-width: 720px;
  background: #fff;
  margin: 40px auto;
  padding: 25px;
  border-radius: 8px;
}
h1 {
  font-size: 20px;
  text-align: center;
}
.notice {
  background: #eee;
  padding: 12px;
  margin: 20px 0;
  font-size: 14px;
}
label {
  font-weight: bold;
  margin-top: 15px;
  display: block;
}
input, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
}
button {
  background: black;
  color: white;
  border: none;
  cursor: pointer;
  margin-top: 20px;
}
button:disabled {
  background: #777;
}
.hidden {
  display: none;
}
#successMessage {
  background: #e6ffe6;
  padding: 15px;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<h1>
Petition & Allegation Submission against Dr Ifeanyi Onukwubiri<br>
<small>TMT Travels and Tours Limited</small>
</h1>

<div class="notice">
This form is provided for victims to submit details of payments made to
<strong>TMT Travels and Tours Limited</strong>.
</div>

<form id="petitionForm" enctype="multipart/form-data">

<label>Full Name *</label>
<input type="text" name="full_name" required>

<label>Email *</label>
<input type="email" name="email" required>

<label>Phone *</label>
<input type="tel" name="phone" required>

<label>Date of Payment *</label>
<input type="date" name="payment_date" required>

<label>Account Name of TMT TRAVEL you paid to </label>
<input type="text" name="account_name">

<label>Account Number of TMT TRAVEL you paid to </label>
<input type="text" name="account_number">

<label>Upload Proof of Payment</label>
<input type="file" name="proof" multiple required>

<button type="submit">Submit Allegation</button>
</form>

<div id="successMessage" class="hidden"></div>

</div>

<script>
document.getElementById("petitionForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const btn = this.querySelector("button");
  btn.textContent = "Submitting...";
  btn.disabled = true;

  const formData = new FormData(this);

  fetch(
    "https://script.google.com/macros/s/AKfycbx-4flPY6WFshdAy9Aj_GHfVZSQgCUtVk-1iObKqRcfhJbdCz1m8_6f3Qhxj0AjDpwX/exec",
    {
      method: "POST",
      body: formData,
      mode: "no-cors"
    }
  ).then(() => {
    this.reset();
    const msg = document.getElementById("successMessage");
    msg.classList.remove("hidden");
    msg.innerHTML =
      "<strong>Submission successful.</strong><br>Your petition details  has been received  by ELUYEFA CHAMBERS on behalf of MR SCOTT IGUMA the activist  and your petition is being currently  being reviewed.";
  }).catch(() => {
    alert("Submission failed. Please try again.");
  }).finally(() => {
    btn.textContent = "Submit Allegation";
    btn.disabled = false;
  });
});
</script>

</body>
</html>
